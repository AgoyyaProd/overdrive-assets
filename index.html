<script>
// The logo is white-on-transparent by default (visible on dark browser tabs/OS themes)
// but swaps to a black-on-transparent version when the user's system is in light mode,
// so the tab icon stays visible either way.
(function() {
  var FAVICON_WHITE = "https://raw.githubusercontent.com/AgoyyaProd/overdrive-assets/main/favicon.svg";
  var FAVICON_BLACK = "https://raw.githubusercontent.com/AgoyyaProd/overdrive-assets/main/favicon-black.svg";
  function applyFavicon() {
    var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var link = document.getElementById('favicon');
    if (link) link.href = isLight ? FAVICON_BLACK : FAVICON_WHITE;
  }
  applyFavicon();
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', applyFavicon);
    else if (mq.addListener) mq.addListener(applyFavicon); // older Safari
  }
})();
</script>
